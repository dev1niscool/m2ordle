name: Publish M2ordle
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: Cloudflare API origin
        required: false
        default: https://m2ordle-api.devinkancherlaawesome-bbc.workers.dev
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build public frontend
        env:
          M2ORDLE_API_URL: ${{ inputs.api_url || 'https://m2ordle-api.devinkancherlaawesome-bbc.workers.dev' }}
        run: node scripts/build.mjs --static-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
